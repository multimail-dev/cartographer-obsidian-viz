name: Markdown security regression tests

on:
  push:
    branches: [codex/fix-markdown-xss]
  pull_request:
    paths:
      - "apps/atlas-ui/src/frontend/**"
      - "tests/e2e/**"
      - "package.json"
      - "playwright.config.ts"
      - ".github/workflows/markdown-security.yml"

permissions:
  contents: read

jobs:
  markdown-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"
      - run: bun install
      - run: bun test apps/atlas-ui/tests/
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test tests/e2e/atlas-ui.spec.ts
